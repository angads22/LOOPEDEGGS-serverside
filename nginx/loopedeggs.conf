# LifeLoop Hub — Nginx config for loopedeggs.ca
# Managed by certbot after SSL provisioning.
# Place at: /etc/nginx/sites-available/loopedeggs

# Redirect bare HTTP → HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name loopedeggs.ca www.loopedeggs.ca;

    location /.well-known/acme-challenge/ { root /var/www/html; }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name loopedeggs.ca www.loopedeggs.ca;

    # SSL — filled in by certbot
    ssl_certificate     /etc/letsencrypt/live/loopedeggs.ca/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/loopedeggs.ca/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options            DENY                        always;
    add_header X-Content-Type-Options     nosniff                     always;
    add_header Referrer-Policy            "strict-origin-when-cross-origin" always;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/javascript;
    gzip_vary  on;
    gzip_min_length 1024;

    # Proxy to Node app
    location / {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
        proxy_set_header   X-Real-IP  $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 86400s;
    }

    # Long-cache static assets (versioned by Express max-age)
    location ~* \.(js|css|woff2|ico|svg|png|jpg|jpeg)$ {
        proxy_pass http://127.0.0.1:3000;
        add_header Cache-Control "public, max-age=604800, immutable";
    }
}
